name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, JS budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:budget

  db:
    name: Database (migrations, RLS tests, advisors, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Applies every migration from scratch, then supabase/seed.sql.
      - run: >-
          pnpm exec supabase start -x
          realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm test:db
      - run: pnpm db:advisors
      - name: Generated types match the schema
        run: pnpm db:types && git diff --exit-code src/lib/supabase/database.types.ts

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Auth, REST, Storage and Realtime (behind Kong) plus Mailpit for the emails. Playwright also starts
      # a Brønnøysundregistrene stub (e2e/support/brreg-stub.mjs).
      - run: >-
          pnpm exec supabase start -x
          imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm db:env
      - run: pnpm test:e2e
      # Lighthouse (mobile) on the public vendor page of a production build: ≥ 90 (QR-02).
      - run: pnpm build
      - run: |
          pnpm start -p 3300 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3300/ && break; sleep 1; done
          pnpm check:lighthouse
        env:
          LIGHTHOUSE_URL: http://127.0.0.1:3300/e/affn-2027/mama-afrika-kjokken
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
